<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monitoring Penilaian – Mutu Tebu (Live + Capture Lock)</title>

    <!-- TensorFlow.js & Teachable Machine Image Library -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

    <style>
      /* =========================
       Gaya Global & Layout
    ========================= */
      html,
      body {
        height: 100%;
        margin: 0;
        padding: 0;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        background-color: #f9f9f9;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        color: #333;
        padding: 20px;
        box-sizing: border-box;
      }
      h1 {
        margin-bottom: 1rem;
        font-size: 1.5rem;
        text-align: center;
      }

      /* Wrapper tombol: Start, Capture, Cancel */
      .button-wrapper {
        margin-bottom: 1.5rem;
        width: 100%;
        display: flex;
        justify-content: center;
        gap: 1rem;
      }
      button {
        padding: 0.75rem 1.5rem;
        font-size: 1rem;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        transition: background-color 0.2s;
        color: white;
      }
      #start-button {
        background-color: #4caf50;
      }
      #start-button:hover:not(:disabled) {
        background-color: #45a049;
      }
      #start-button:disabled {
        background-color: #aaa;
        cursor: not-allowed;
      }

      #capture-button {
        background-color: #2196f3;
      }
      #capture-button:hover:not(:disabled) {
        background-color: #1976d2;
      }
      #capture-button:disabled {
        background-color: #aaa;
        cursor: not-allowed;
      }

      #cancel-button {
        background-color: #f44336;
      }
      #cancel-button:hover:not(:disabled) {
        background-color: #d32f2f;
      }
      #cancel-button:disabled {
        background-color: #aaa;
        cursor: not-allowed;
      }

      /* =========================
       Layout: Webcam + Hasil + Preview
    ========================= */
      .container {
        display: flex;
        flex-direction: row;
        align-items: flex-start;
        gap: 2rem;
        width: 100%;
        max-width: 720px;
        justify-items: center;
      }

      .webcam-wrapper,
      .results-wrapper,
      .preview-wrapper {
        flex: 1;
        min-width: 300px;
      }

      /* =========================
       Styling Preview (Hasil Screenshot)
    ========================= */
      .preview-wrapper {
        height: 320px;
        background-color: #000;
        border: 2px solid #ddd;
        border-radius: 4px;
        overflow: hidden;
        display: none; /* Default: hidden */
        justify-content: center;
        align-items: center;
        position: relative;
      }
      #preview-img {
        width: 100%;
        display: block;
      }
      .preview-label {
        text-align: center;
        background-color: #f5f5f5;
        padding: 0.5rem;
        font-size: 0.9rem;
        color: #555;
      }

      .webcam-wrapper {
        height: 320px;
        background-color: #000;
        border: 2px solid #ddd;
        border-radius: 4px;
        overflow: hidden;
        display: none; /* Default: hidden */
        justify-content: center;
        align-items: center;
        position: relative;
      }
      .webcam-wrapper.visible {
        display: flex; /* Show ketika class “visible” ditambahkan */
      }

      /* Results Wrapper */
      .results-wrapper {
        display: flex;
        flex-direction: column;
        gap: 1rem;
        background-color: #fff;
        border: 2px solid #ddd;
        border-radius: 4px;
        padding: 1rem;
        max-height: 320px;
        overflow-y: auto;
      }

      /* Progress Bar Styling */
      .class-row {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
      }
      .class-label {
        font-size: 0.95rem;
        font-weight: 500;
        display: flex;
        justify-content: space-between;
      }
      .progress-bar-container {
        width: 100%;
        height: 20px;
        background-color: #e0e0e0;
        border-radius: 12px;
        overflow: hidden;
        position: relative;
      }
      .progress-bar-fill {
        height: 100%;
        width: 0%;
        background-color: #d32f2f;
        border-radius: 12px 0 0 12px;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        padding-right: 8px;
        color: white;
        font-size: 0.85rem;
        font-weight: 600;
        box-sizing: border-box;
        transition: width 0.2s ease;
      }
      .progress-bar-fill.small {
        justify-content: flex-start;
        padding-left: 8px;
        color: #333;
      }
    </style>
  </head>
  <body>
    <h1>MONITORING PENILAIAN</h1>
    <a style="margin-bottom: 1rem; text-align: center">
      MUTU TEBU - PG. JATIROTO
    </a>

    <div class="button-wrapper">
      <button id="start-button" type="button">Mulai</button>
      <button id="capture-button" type="button" disabled>Capture</button>
      <button id="cancel-button" type="button" disabled>Batal</button>
    </div>

    <div class="container">
      <!-- Webcam area -->
      <div class="webcam-wrapper" id="webcam-wrapper">
        <div id="webcam-container"></div>
      </div>

      <div class="preview-wrapper" id="preview-wrapper">
        <div class="preview-label">Hasil Capture:</div>
        <img id="preview-img" src="" alt="Preview Capture" />
      </div>

      <div class="results-wrapper" id="results-wrapper"></div>
    </div>

    <!-- Preview hasil screenshot -->

    <script>
      // Path folder model Teachable Machine
      const URL = "./model/";
      let model, webcam, maxPredictions;

      // ID untuk drawLoop dan predLoop agar bisa di‐cancel
      let drawLoopId, predLoopId;
      // Flag untuk kontrol live prediksi
      let isLivePredicting = false;

      // Referensi elemen
      const webcamWrapper = document.getElementById("webcam-wrapper");
      const resultsWrapper = document.getElementById("results-wrapper");
      const startButton = document.getElementById("start-button");
      const captureButton = document.getElementById("capture-button");
      const cancelButton = document.getElementById("cancel-button");
      const previewWrapper = document.getElementById("preview-wrapper");
      const previewImg = document.getElementById("preview-img");

      // Event listener
      startButton.addEventListener("click", init);
      captureButton.addEventListener("click", capture);
      cancelButton.addEventListener("click", cancel);

      async function init() {
        const modelURL = URL + "model.json";
        const metadataURL = URL + "metadata.json";
        model = await tmImage.load(modelURL, metadataURL);
        maxPredictions = model.getTotalClasses();

        const flip = true;
        webcam = new tmImage.Webcam(320, 240, flip);
        await webcam.setup();
        await webcam.play();

        webcamWrapper.classList.add("visible");

        document.getElementById("webcam-container").appendChild(webcam.canvas);

        // 5. Mulai drawLoop agar canvas menampilkan video live
        drawLoop();

        // 6. Generate dan mulai predLoop untuk progress bars live
        resultsWrapper.innerHTML = "";
        for (let i = 0; i < maxPredictions; i++) {
          const className = model.getClassLabels()[i];
          const rowDiv = document.createElement("div");
          rowDiv.classList.add("class-row");

          const labelBar = document.createElement("div");
          labelBar.classList.add("class-label");
          const leftLabel = document.createElement("span");
          leftLabel.innerText = className;
          const rightLabel = document.createElement("span");
          rightLabel.innerText = "0%";
          rightLabel.id = `label-${i}`;
          labelBar.appendChild(leftLabel);
          labelBar.appendChild(rightLabel);

          const barContainer = document.createElement("div");
          barContainer.classList.add("progress-bar-container");
          const barFill = document.createElement("div");
          barFill.classList.add("progress-bar-fill");
          barFill.id = `fill-${i}`;
          barFill.style.width = "0%";
          barFill.innerText = "0%";
          barContainer.appendChild(barFill);

          rowDiv.appendChild(labelBar);
          rowDiv.appendChild(barContainer);
          resultsWrapper.appendChild(rowDiv);
        }

        isLivePredicting = true;
        predLoop();

        startButton.disabled = true;
        captureButton.disabled = false;
        cancelButton.disabled = false;

        previewWrapper.style.display = "none";
        previewImg.src = "";
      }

      function drawLoop() {
        webcam.update();
        drawLoopId = requestAnimationFrame(drawLoop);
      }

      async function predLoop() {
        if (!isLivePredicting) return;

        const predictions = await model.predict(webcam.canvas);

        // Mapping warna per nama kelas
        const colorMap = {
          A: "#4CAF50", // Hijau (Bagus)
          B: "#2196F3", // Biru  (Cukup)
          C: "#FFC107", // Kuning (Sedang)
          D: "#FF9800", // Oranye (Buruk)
          E: "#F44336", // Merah  (Sangat Buruk)
        };

        predictions.forEach((p, index) => {
          const percent = p.probability * 100;
          const percentText = percent.toFixed(1) + "%";

          const labelSpan = document.getElementById(`label-${index}`);
          if (labelSpan) labelSpan.innerText = percentText;

          const fillDiv = document.getElementById(`fill-${index}`);
          if (fillDiv) {
            fillDiv.style.width = `${percent}%`;
            fillDiv.innerText = percentText;
            if (percent < 20) {
              fillDiv.classList.add("small");
            } else {
              fillDiv.classList.remove("small");
            }
            fillDiv.style.backgroundColor = colorMap[p.className] || "#9E9E9E";
          }
        });

        predLoopId = requestAnimationFrame(predLoop);
      }

      async function capture() {
        isLivePredicting = false;
        cancelAnimationFrame(predLoopId);

        const dataURL = webcam.canvas.toDataURL("image/png");
        previewImg.src = dataURL;
        previewWrapper.style.display = "block";

        const prediction = await model.predict(webcam.canvas);

        const colorMap = {
          A: "#4CAF50",
          B: "#2196F3",
          C: "#FFC107",
          D: "#FF9800",
          E: "#F44336",
        };

        // Update progress bars sekali lagi
        prediction.forEach((p, index) => {
          const percent = p.probability * 100;
          const percentText = percent.toFixed(1) + "%";

          const labelSpan = document.getElementById(`label-${index}`);
          if (labelSpan) labelSpan.innerText = percentText;

          const fillDiv = document.getElementById(`fill-${index}`);
          if (fillDiv) {
            fillDiv.style.width = `${percent}%`;
            fillDiv.innerText = percentText;
            if (percent < 20) {
              fillDiv.classList.add("small");
            } else {
              fillDiv.classList.remove("small");
            }
            fillDiv.style.backgroundColor = colorMap[p.className] || "#9E9E9E";
          }
        });

        captureButton.disabled = true;
      }

      function cancel() {
        cancelAnimationFrame(drawLoopId);
        cancelAnimationFrame(predLoopId);

        if (webcam && webcam.stop) {
          webcam.stop();
        } else if (webcam && webcam.video && webcam.video.srcObject) {
          webcam.video.srcObject.getTracks().forEach((track) => track.stop());
        }

        webcamWrapper.classList.remove("visible");

        document.getElementById("webcam-container").innerHTML = "";

        resultsWrapper.innerHTML = "";

        startButton.disabled = false;
        captureButton.disabled = true;
        cancelButton.disabled = true;

        previewWrapper.style.display = "none";
        previewImg.src = "";
      }
    </script>
  </body>
</html>
